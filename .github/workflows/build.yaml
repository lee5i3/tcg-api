# Docker image build (+ publish to ECR). On pull requests images are built
# but not pushed — the "build" status check gates the merge. On main (and
# manual dispatch) images are pushed tagged with the commit SHA and "latest".
#
# Requires for pushes:
#   secret  AWS_ROLE_ARN   — IAM role assumable via GitHub OIDC with ECR push rights
#   var     AWS_REGION     — e.g. us-east-1
# The ECR repositories are created by the api/jobs Terraform stacks.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for AWS
    strategy:
      fail-fast: false
      matrix:
        include:
          - function: api-game-routes
            context_dir: apps/api/game-routes
          - function: api-set-routes
            context_dir: apps/api/set-routes
          - function: api-card-routes
            context_dir: apps/api/card-routes
          - function: api-auth-routes
            context_dir: apps/api/auth-routes
          - function: pokemon-price-updater
            context_dir: apps/jobs/pokemon-price-updater
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: configure AWS credentials
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ECR
        if: env.PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: image name
        id: image
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "name=${{ steps.ecr.outputs.registry }}/tcg-${{ matrix.function }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=tcg-${{ matrix.function }}-pr" >> "$GITHUB_OUTPUT"
          fi

      - name: build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.context_dir }}/Dockerfile
          platforms: linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.function }}
          cache-to: type=gha,scope=${{ matrix.function }},mode=max
