// TCG API — service-to-service contract for the card catalog.
//
// gRPC is the trusted read/write surface used by companion services
// (scrapers, pricing jobs, importers). Public read access goes through
// GraphQL instead.
//
// Data-model rules the contract reflects:
//   * prices live on a card's variants (per printing) and on sealed
//     products, overwritten in place — there is no price history
//   * set sizes are never stored — card_count is always a live count
//   * cards have a GUID id plus an optional TCGplayer product id; card
//     lookups accept either
//   * games and sets have a GUID id with an immutable catalog key
//     ("pokemon", "sv3pt5"); their lookups accept either

syntax = "proto3";

package tcgapi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lee5i3/pokemon-invest/internal/pb/tcgapi/v1;tcgapiv1";

service CatalogService {
  // Games
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);

  // Sets
  rpc ListSets(ListSetsRequest) returns (ListSetsResponse);
  rpc CreateSet(CreateSetRequest) returns (CreateSetResponse);
  rpc UpdateSet(UpdateSetRequest) returns (UpdateSetResponse);
  rpc DeleteSet(DeleteSetRequest) returns (DeleteSetResponse);

  // Cards
  rpc ListSetCards(ListSetCardsRequest) returns (ListSetCardsResponse);
  rpc SearchCards(SearchCardsRequest) returns (SearchCardsResponse);
  rpc GetCard(GetCardRequest) returns (GetCardResponse);
  rpc CreateCard(CreateCardRequest) returns (CreateCardResponse);
  rpc UpdateCard(UpdateCardRequest) returns (UpdateCardResponse);
  rpc DeleteCard(DeleteCardRequest) returns (DeleteCardResponse);
}

// ---------------------------------------------------------------------------
// Shared shapes
// ---------------------------------------------------------------------------

message Game {
  string id = 1;  // GUID
  string key = 2; // immutable routing key, unique (e.g. "pokemon")
  string language = 5; // ISO 639 alpha-3 ("eng", "jpn"); immutable
  string label = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Set {
  string id = 1;   // GUID
  string key = 2;  // catalog set id (e.g. "sv3pt5"), unique per game, immutable
  string language = 15; // ISO 639 alpha-3 ("eng", "jpn"); immutable
  string game_id = 3; // games.id GUID
  string name = 4;
  int32 card_count = 7;             // live count, never stored
  optional string release_date = 9; // YYYY-MM-DD
  optional int32 card_total = 14;   // official printed set size
  optional string logo_url = 10;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;

  // Retired set-symbol and series fields.
  reserved 5, 6, 8, 11;
  reserved "series_id", "series", "symbol_text", "symbol_image";
}

// One printing a card exists in ("Normal", "Holofoil", "Reverse Holofoil",
// "Cold Foil", "Unlimited", "1st Edition", ...) with its current price.
message CardVariant {
  string id = 1; // GUID
  string name = 2;
  optional double price = 3;
}

message Card {
  string id = 1;      // GUID
  optional int32 tcgplayer_id = 16; // TCGplayer product id; unset when not listed there
  string language = 15; // ISO 639 alpha-3 ("eng", "jpn"); immutable
  string game_id = 3; // games.id GUID
  string set_id = 4;  // set GUID
  string name = 5;
  string number = 6;
  optional string rarity = 7;
  optional string image_small = 8;
  optional string image_large = 9;
  // The printings this card exists in, with their current prices
  repeated CardVariant variants = 17;
  // When the card row itself last changed
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp created_at = 14;

  // Retired: catalog key (e.g. "base1-4") and the price-snapshot fields.
  reserved 2, 10, 11, 12;
  reserved "key", "price", "price_updated_at";
}

// ---------------------------------------------------------------------------
// Games
// ---------------------------------------------------------------------------

message ListGamesRequest {}

message ListGamesResponse {
  repeated Game games = 1;
}

message CreateGameRequest {
  string key = 1; // ^[a-z0-9-]{2,32}$
  string label = 2;
  optional string language = 3; // ISO 639 alpha-3; defaults to "eng"
}

message CreateGameResponse {
  Game game = 1;
}

// ---------------------------------------------------------------------------
// Sets
// ---------------------------------------------------------------------------

message ListSetsRequest {
  string game = 1;
  optional string query = 2; // set-name filter
}

message ListSetsResponse {
  repeated Set sets = 1;
}

message CreateSetRequest {
  string game = 1; // GUID or key
  string key = 2;  // immutable catalog id (e.g. "sv3pt5")
  optional string language = 10; // ISO 639 alpha-3; defaults to "eng"; immutable
  string name = 3;
  optional string release_date = 6; // YYYY-MM-DD
  optional int32 card_total = 9;    // official printed set size
  optional string logo_url = 7;

  // Retired set-symbol and series fields.
  reserved 4, 5, 8;
  reserved "series", "symbol_text", "symbol_image";
}

message CreateSetResponse {
  string id = 1; // GUID
  string key = 2;
}

message UpdateSetRequest {
  string game = 1; // GUID or key
  string id = 2;   // set GUID or key
  string name = 3;
  optional string release_date = 6; // YYYY-MM-DD
  optional int32 card_total = 9;    // official printed set size
  optional string logo_url = 7;

  // Retired set-symbol and series fields.
  reserved 4, 5, 8;
  reserved "series", "symbol_text", "symbol_image";
}

message UpdateSetResponse {}

message DeleteSetRequest {
  string game = 1; // GUID or key
  string id = 2;   // set GUID or key
}

message DeleteSetResponse {
  int32 removed_cards = 1;
}

// ---------------------------------------------------------------------------
// Cards
// ---------------------------------------------------------------------------

message ListSetCardsRequest {
  string game = 1;   // GUID or key
  string set_id = 2; // set GUID or key
}

message ListSetCardsResponse {
  repeated Card cards = 1;
}

message SearchCardsRequest {
  string game = 1;
  string query = 2; // card-name fragment, min 2 chars
}

message SearchCardsResponse {
  repeated Card cards = 1;
}

message GetCardRequest {
  string game = 1;
  string id = 2; // GUID or TCGplayer id
}

message GetCardResponse {
  Card card = 1;
}

message CreateCardRequest {
  string game = 1;   // GUID or key
  optional int32 tcgplayer_id = 10; // TCGplayer product id
  optional string language = 9; // ISO 639 alpha-3; defaults to "eng"; immutable
  string set_id = 3; // set GUID or key
  string name = 4;
  optional string number = 5;
  optional string rarity = 6;
  optional string image_small = 7;
  optional string image_large = 8;

  // Retired catalog key.
  reserved 2;
  reserved "key";
}

message CreateCardResponse {
  string id = 1; // GUID
}

message UpdateCardRequest {
  string game = 1;   // GUID or key
  string id = 2;     // card GUID or TCGplayer id
  optional int32 tcgplayer_id = 9; // TCGplayer product id
  string set_id = 3; // set GUID or key
  string name = 4;
  optional string number = 5;
  optional string rarity = 6;
  optional string image_small = 7;
  optional string image_large = 8;
}

message UpdateCardResponse {}

message DeleteCardRequest {
  string game = 1;
  string id = 2; // GUID or TCGplayer id
}

message DeleteCardResponse {}
