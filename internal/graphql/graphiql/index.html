<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TCG API — GraphiQL</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>"
    />
    <link rel="stylesheet" href="/graphiql/graphiql.min.css" />
    <style>
      body { margin: 0; }
      #graphiql { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="graphiql">Loading…</div>
    <script src="/graphiql/react.min.js"></script>
    <script src="/graphiql/react-dom.min.js"></script>
    <script src="/graphiql/graphiql.min.js"></script>
    <script>
      const root = ReactDOM.createRoot(document.getElementById('graphiql'));
      root.render(
        React.createElement(GraphiQL, {
          fetcher: GraphiQL.createFetcher({ url: '/graphql' }),
          defaultQuery:
            '# TCG API — public read-only GraphQL\n' +
            '{\n' +
            '  games { key label }\n' +
            '  sets(game: "pokemon", query: "151") { id name cardCount releaseDate }\n' +
            '  searchCards(game: "pokemon", query: "zapdos") { key name number price }\n' +
            '}\n',
        })
      );
    </script>
  </body>
</html>
